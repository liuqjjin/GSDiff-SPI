seed: 42

scene:
  num_gaussians: 500
  init_scale: 1.5
  init_mode: random    # random | dgi   (scheme B: DGI amplitude warm-start)

motion:
  enable_rotation: true

data:
  image_size: [64, 64]
  num_frames: 20
  num_patterns: 2500
  pattern_type: random    # bernoulli | gaussian | random | s_matrix
  snr_db: 0
  shape: "assets/tank.png"                # "7" | "L" | "T" | "circle" | path to image
  motion_type: custom_se2   # custom_se2 | translation | rotation | shear | swirl | translation_and_rotation
  motion_mode: 2            # 1: one frame per pattern, 2: fixed T frames
  speed_factor: 1.0
  gt_velocity: [8, 8]  # [v_y, v_x] pixels total (for custom_se2)
  gt_omega: 0.3           # radians total (for custom_se2)

solver:
  type: admm          # admm | sgd
  loss_norm: zscore    # zscore | target_std

  # ── SGD (do not change) ────────────────────────────────────
  lr_scene: 0.9e-2
  lr_motion: 15.0e-2
  sgd_steps: 2500
  tv_weight: 0.005

  # ── ADMM (tunable independently) ──────────────────────────
  num_outer: 80       # all warmup, no Chambolle TV z-step
  num_inner: 50       # 80×50 = 4000 steps (1.6× SGD)
  admm_n_warmup: 80   # entire run is data-loss + soft-TV warmup
  rho: 0.1
  rho_growth: 1.05
  admm_tv_weight: 0.005      # Chambolle TV (unused since n_warmup=num_outer)
  admm_soft_tv_weight: 0.005 # soft differentiable TV in θ-step (same as SGD)
  admm_lr_scene: 0.9e-2
  admm_lr_motion: 15.0e-2

  # ── 3D TV: spatial + temporal (optional) ───────────────────
  use_3dtv: true        # true: add temporal TV term to both solvers
  temporal_tv_weight: 0.1 # α: weight of temporal TV relative to spatial TV
                          #    α<1 → weaker temporal constraint

output_dir: ./results/11
 