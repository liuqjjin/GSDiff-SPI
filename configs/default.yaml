seed: 42

scene:
  num_gaussians: 500
  init_scale: 1.5
  init_mode: random    # random | dgi   (scheme B: DGI amplitude warm-start)

motion:
  enable_rotation: false

data:
  image_size: [64, 64]
  num_frames: 20
  num_patterns: 2500
  pattern_type: random    # bernoulli | gaussian | random | s_matrix
  snr_db: 18
  time_assignment_mode: uniform  # uniform | interpolation
  shape: "assets/tank.png"                # "7" | "L" | "T" | "circle" | path to image
  motion_type: custom_se2   # custom_se2 | translation | rotation | shear | swirl | translation_and_rotation
  motion_mode: 2            # 1: one frame per pattern, 2: fixed T frames
  speed_factor: 1.0
  gt_velocity: [8, 8]  # [v_y, v_x] pixels total (for custom_se2)
  gt_omega: 0.3         # radians total (for custom_se2)

solver:
  type: admm          # admm | sgd
  loss_norm: zscore    # zscore | target_std

  # ── SGD (do not change) ────────────────────────────────────
  lr_scene: 0.9e-2
  lr_motion: 15.0e-2
  sgd_steps: 2500
  tv_weight: 0.005

  # ADMM: true ADMM activated
  num_outer: 80
  num_inner: 50
  admm_n_warmup: 40
  rho: 0.1
  rho_growth: 1.05
  admm_tv_weight: 0.005
  admm_soft_tv_weight: 0.006
  admm_lr_scene: 0.9e-2
  admm_lr_motion: 15.0e-2

  # 3D TV enabled
  use_3dtv: true
  temporal_tv_weight: 0.05

  # ── Prior selection ────────────────────────────────────────
  prior_type: diffusion           # tv | diffusion  (default=tv, backward compatible)
  diffusion_prior:            # only used when prior_type=diffusion
    checkpoint: checkpoints/diffusion_prior.pt
    denoise_steps: 5          # 1=Tweedie single-step, 3-5=multi-step DDIM
    clamp_range: [0.0, 1.0]
    sigma_start: 0.3         # σ at first z-step (strong denoising)
    sigma_end: 0.3          # σ at last z-step (weak denoising)

output_dir: ./results/admm_n_warmup_40
 